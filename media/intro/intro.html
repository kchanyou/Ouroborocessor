<style>
:root {
  --paper: #f7f4ec; --ink: #24231f; --muted: #8b877d; --soft: #b9b4a8; --green: #3d6b50; --green-soft: #dfe8df;

  --sans: "Noto Sans KR", sans-serif; --serif: "Source Serif 4", "Noto Serif KR", serif;
}
html[lang=ja] { --sans: "Noto Sans JP", sans-serif; --serif: "Source Serif 4", "Noto Serif JP", serif; }
html[lang=zh] { --sans: "Noto Sans SC", sans-serif; --serif: "Source Serif 4", "Noto Serif SC", serif; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
body { position: relative; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; }
#bg { background: var(--paper); }
#wipe { clip-path: circle(0 at 50% 50%); }
.abs { position: absolute; will-change: transform, opacity; }

/* opening lines */
#type { left: 90px; top: 760px; width: 900px; font-family: var(--serif); }
#line1 { font-size: 64px; line-height: 1.3; color: var(--ink); }
#line2 { margin-top: 26px; font-size: 76px; line-height: 1.3; font-weight: 600; color: var(--ink); }
#line2 .hi { color: var(--green); position: relative; }
#line2 .hi i { position: absolute; left: 0; bottom: -6px; height: 5px; background: var(--green); border-radius: 3px; }
.caret { display: inline-block; width: 4px; height: 0.95em; margin-left: 4px; vertical-align: -0.12em; background: var(--green); }

/* headings */
.heading { left: 0; right: 0; top: 470px; text-align: center; }
.heading h1 { margin: 0; font-size: 104px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.heading p { margin: 18px 0 0; font-size: 32px; color: var(--muted); }

/* tree */
#tree { left: 0; top: 0; width: 1080px; height: 1920px; }
.part { position: absolute; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
.part::before { content: ""; width: 12px; height: 12px; border-radius: 2px; background: var(--green); }
.scene { position: absolute; width: 560px; height: 82px; display: flex; align-items: center; gap: 18px; padding: 0 26px;
  background: var(--card); border-radius: 14px; box-shadow: 0 2px 4px rgb(0 0 0 / 5%), 0 10px 30px rgb(0 0 0 / 8%); }
.scene b { font-family: var(--serif); font-size: 32px; font-weight: 600; flex: 1; white-space: nowrap; }
.scene small { font-size: 20px; color: var(--muted); white-space: nowrap; }
.doc-glyph { width: 22px; height: 28px; border: 2.5px solid #8e8a80; border-radius: 3px; position: relative; flex-shrink: 0; }
.doc-glyph::after { content: ""; position: absolute; left: 4px; right: 4px; top: 7px; height: 9px; border-top: 2px solid #8e8a80; border-bottom: 2px solid #8e8a80; }
.branch { position: absolute; height: 3px; background: var(--green); }
#trunk { position: absolute; width: 4px; background: var(--green); border-radius: 2px; }

/* cards */
.card { background: var(--card); color: var(--card-ink); border-radius: 18px; box-shadow: 0 2px 4px rgb(0 0 0 / 5%), 0 14px 40px rgb(0 0 0 / 9%); }
#ms { padding: 34px 44px 40px; }
#ms .label, .kind { font-size: 22px; font-weight: 700; color: var(--muted); }
#ms .text { margin-top: 14px; font-family: var(--serif); font-size: 40px; line-height: 1.65; min-height: 132px; }
mark { background: var(--green-soft); color: inherit; font-weight: 700; padding: 0 4px; border-radius: 6px; }
#char { padding: 32px 44px 36px; border-left: 8px solid var(--green); }
#char .kind { color: var(--green); }
#char h2 { margin: 8px 0 6px; font-family: var(--serif); font-size: 56px; font-weight: 600; }
#char p { margin: 0; font-family: var(--serif); font-size: 27px; color: var(--muted); line-height: 1.5; }
#pill { display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 16px; border-radius: 14px; font-size: 25px; color: var(--muted); background: rgb(0 0 0 / 4.5%); }
#pill svg { width: 28px; height: 28px; }
#pill .n { min-width: 34px; height: 34px; border-radius: 17px; background: rgb(0 0 0 / 7%); display: grid; place-items: center; font-size: 21px; font-weight: 700; color: var(--ink); }
#link { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
#divider { left: 0; height: 4px; background: var(--green); }

/* themes */
#swatches { left: 0; right: 0; top: 1150px; display: flex; justify-content: center; gap: 62px; }
.sw { display: grid; justify-items: center; gap: 16px; font-size: 22px; color: var(--muted); }
.sw i { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgb(0 0 0 / 12%); position: relative; }
.sw i::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 4px solid var(--green); opacity: var(--on, 0); }
.sw.on { color: var(--ink); font-weight: 700; }

/* goals */
#goals { left: 140px; width: 800px; padding: 44px 48px 48px; }
.goal + .goal { margin-top: 40px; padding-top: 36px; border-top: 1.5px solid rgb(0 0 0 / 7%); }
.goal .row { display: flex; justify-content: space-between; align-items: baseline; }
.goal .row span { font-size: 28px; font-weight: 700; }
.goal .row b { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); }
.goal .row b em { font-style: normal; color: var(--ink); font-weight: 700; }
.track { margin-top: 20px; height: 18px; border-radius: 9px; background: rgb(0 0 0 / 7%); overflow: hidden; }
.goal.small .track { height: 12px; }
.fill { height: 100%; border-radius: inherit; background: var(--green); }

/* rewind */
#timeline { left: 200px; width: 680px; top: 1170px; height: 90px; }
#timeline .bar { position: absolute; left: 0; right: 0; top: 14px; height: 3px; background: #d6d1c5; }
.tick { position: absolute; top: 6px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #9a958a; transform: scale(0.6); }
.tick-label { position: absolute; top: 48px; width: 200px; margin-left: -100px; text-align: center; font-size: 24px; color: var(--muted); }
#knob { position: absolute; top: -4px; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; border: 4px solid var(--green); background: var(--paper); }
#knob::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--green); }

/* export */
.file { width: 210px; height: 270px; }
.file .sheet { position: absolute; inset: 0; background: var(--card); border-radius: 14px; box-shadow: 0 2px 4px rgb(0 0 0 / 6%), 0 16px 40px rgb(0 0 0 / 10%);
  clip-path: polygon(0 0, 74% 0, 100% 20%, 100% 100%, 0 100%); }
.file .fold { position: absolute; right: 0; top: 0; width: 26%; height: 20%; background: #e4dfd3; border-bottom-left-radius: 10px; }
.file .badge { position: absolute; left: 22px; top: 28px; padding: 6px 12px; border-radius: 7px; color: #fff; font-size: 24px; font-weight: 800; letter-spacing: 0.02em; }
.file .lines { position: absolute; left: 24px; right: 24px; top: 98px; display: grid; gap: 22px; }
.file .lines i { height: 5px; border-radius: 3px; background: #d8d3c7; }
.file .lines i:nth-child(4) { width: 62%; }
#paper-note { left: 0; right: 0; top: 1290px; text-align: center; font-size: 28px; color: var(--muted); }

/* ending */
#logo { left: 290px; top: 470px; width: 500px; height: 500px; }
#logo img { position: absolute; left: 0; top: 0; width: 500px; height: 500px; }
#ring { left: 290px; top: 470px; width: 500px; height: 500px; overflow: visible; }
#wordmark { left: 0; right: 0; top: 1070px; text-align: center; font-family: "Source Serif 4", serif; font-weight: 600; font-size: 104px; letter-spacing: -0.01em; }
#tagline { left: 0; right: 0; top: 1240px; text-align: center; font-size: 44px; line-height: 1.6; white-space: pre-line; }
#meta { left: 0; right: 0; top: 1470px; text-align: center; font-size: 28px; color: var(--muted); }
#cta { left: 0; right: 0; top: 1525px; text-align: center; font-size: 36px; font-weight: 700; color: var(--green); }
</style>
</head>

const TREE_TOP = 760, TREE_BOTTOM = ty - 120;
// deterministic scatter
const scatter = treeItems.map((_, i) => ({ dx: [-260, 220, -120, 300, -300, 140, -40][i % 7], dy: [-520, -380, -640, -300, -460, -700, -560][i % 7], r: [-18, 14, -9, 22, -24, 11, -15][i % 7] }));

// cards
$("#ms .label").textContent = C.msLabel;
const msChars = [];
C.ms.forEach(([text, isMark]) => Array.from(text).forEach((ch) => msChars.push({ ch, mark: !!isMark })));
function msHTML(n) {
  let out = "", open = false;
  msChars.slice(0, n).forEach(({ ch, mark }) => {
    if (mark && !open) { out += "<mark>"; open = true; }
    if (!mark && open) { out += "</mark>"; open = false; }
    out += esc(ch);
  });
  return out + (open ? "</mark>" : "");
}
$("#char .kind").textContent = C.kind; $("#char h2").textContent = C.name; $("#char p").textContent = C.desc;
$("#pill .t").textContent = C.pill;

// swatches
C.themes.forEach((name, i) => { const d = document.createElement("div"); d.className = "sw"; d.innerHTML = `<i style="background:${THEMES[i].sw}"></i><span>${esc(name)}</span>`; $("#swatches").appendChild(d); });

// goals
$("#goals").innerHTML = C.goals.map(([label], i) => `<div class="goal ${i ? "small" : ""}"><div class="row"><span>${esc(label)}</span><b></b></div><div class="track"><div class="fill"></div></div></div>`).join("");

// timeline ticks
const tl = $("#timeline");
C.times.forEach((label, i) => { const x = i * 340; tl.insertAdjacentHTML("beforeend", `<div class="tick" style="left:${x}px"></div><div class="tick-label" style="left:${x}px">${esc(label)}</div>`); });
tl.insertAdjacentHTML("beforeend", `<div id="knob"></div>`);

// export files
const FILES = [["DOCX", "#2f5f8a"], ["HWPX", "#3d6b50"], ["ODT", "#6b5a3d"], ["PDF", "#9a3f37"]];
const fileEls = FILES.map(([name, color]) => {
  const f = document.createElement("div"); f.className = "abs file";
  f.innerHTML = `<div class="sheet"></div><div class="fold"></div><div class="badge" style="background:${color}">${name}</div><div class="lines"><i></i><i></i><i></i><i></i></div>`;
  $("#files").appendChild(f); return f;
});
$("#paper-note").textContent = C.paper;
$("#tagline").textContent = C.tagline; $("#meta").textContent = C.meta; $("#cta").textContent = C.cta;

const ringRect = $("#ring-rect");
const ringLen = ringRect.getTotalLength();
ringRect.style.strokeDasharray = ringLen;

function headingState(i, t) {
  const keys = ["tree", "link", "side", "theme", "goal", "rewind", "export"];
  const [a, b] = T[keys[i]];
  const start = i === 0 ? a + 0.5 : a + 0.05;
  const inK = easeOut(prog(t, start, start + 0.45));
  const outK = prog(t, b - 0.3, b);
  return { y: lerp(40, 0, inK) - outK * 30, o: inK * (1 - outK) };
}

function caret(on) { return on ? `<span class="caret"></span>` : ""; }

function render(t) {
  // ---- background / theme wipe
  let theme = 0, prevTheme = 0, wipeK = 1;
  const themeTimes = [11.0, 11.55, 12.1, 12.65, 13.15];
  const order = [1, 2, 3, 4, 0];
  for (let i = 0; i < themeTimes.length; i++) if (t >= themeTimes[i]) { prevTheme = theme; theme = order[i]; wipeK = prog(t, themeTimes[i], themeTimes[i] + 0.45); }
  const swIndex = theme;
  const cur = THEMES[theme], prev = THEMES[prevTheme];
  $("#bg").style.background = prev.bg;
  const sx = 540 + (swIndex - 2) * 126;
  $("#wipe").style.background = cur.bg;
  $("#wipe").style.clipPath = `circle(${easeInOut(wipeK) * 2300}px at ${sx}px 1182px)`;
  const inkK = easeInOut(wipeK);
  document.body.style.setProperty("--ink", mix(prev.ink, cur.ink, inkK));
  document.body.style.setProperty("--card", mix(prev.card, cur.card, inkK));
  document.body.style.setProperty("--card-ink", mix(prev.ink, cur.ink, inkK));
  const dark = (theme >= 3 ? inkK : 0) + (prevTheme >= 3 ? 1 - inkK : 0);
  document.body.style.setProperty("--muted", mix("#8b877d", "#a19d93", dark));
  document.body.style.setProperty("--green-soft", mix("#dfe8df", "#3c5546", dark));

  // ---- opening lines
  {
    const n1 = Math.floor(prog(t, 0.25, 1.25) * Array.from(C.l1).length);
    const l2 = C.l2[0] + C.l2[1];
    const n2 = Math.floor(prog(t, 1.55, 2.55) * Array.from(l2).length);
    const blink = Math.floor(t * 2.2) % 2 === 0;
    const onLine2 = t >= 1.45;
    $("#line1").innerHTML = esc(Array.from(C.l1).slice(0, n1).join("")) + caret(!onLine2 && (blink || t < 1.3));
    const a = Array.from(C.l2[0]), typedA = a.slice(0, n2).join(""), typedB = Array.from(C.l2[1]).slice(0, Math.max(0, n2 - a.length)).join("");
    const underline = easeOut(prog(t, 2.55, 2.95));
    $("#line2").innerHTML = onLine2 ? `<span class="hi">${esc(typedA)}<i style="width:${underline * 100}%"></i></span>${esc(typedB)}${caret(blink || t < 2.6)}` : "";
    $("#line1").style.color = onLine2 ? mix("#24231f", "#aaa596", easeOut(prog(t, 1.4, 1.8))) : "";
    const out = prog(t, 2.95, 3.3);
    set($("#type"), { y: -out * 80, o: 1 - out });
  }

  // ---- tree
  {
    const [a, b] = T.tree;
    const fall = (i) => easeBack(prog(t, a + 0.1 + i * 0.07, a + 0.85 + i * 0.07));
    const outK = easeInOut(prog(t, b - 0.35, b));
    // reorder: third scene moves above second
    const drag = easeInOut(prog(t, 5.05, 5.6));
    const lift = Math.sin(Math.PI * drag);
    treeItems.forEach((item, i) => {
      const k = fall(i);
      const sc = scatter[i];
      let y = item.y;
      if (i === 2) y = lerp(item.y, item.y + 102, drag);
      if (i === 3) y = lerp(item.y, item.y - 102, drag);
      const x = item.x + (1 - k) * sc.dx;
      const yy = y + (1 - k) * sc.dy;
      const pop = i === 3 ? lift : 0;
      set(item.el, { x, y: yy - pop * 8 - outK * 60, r: (1 - k) * sc.r, s: 1 + pop * 0.04, o: clamp(k * 3) * (1 - outK) * (t < a ? 0 : 1) });
      item.el.style.zIndex = i === 3 ? 3 : 1;
      if (pop) item.el.style.boxShadow = `0 2px 4px rgb(0 0 0 / 5%), 0 ${10 + pop * 20}px ${30 + pop * 30}px rgb(0 0 0 / ${8 + pop * 8}%)`;
      if (item.branch) {
        const bk = easeOut(prog(t, a + 1.0 + i * 0.05, a + 1.35 + i * 0.05));
        item.branch.style.left = `${TREE_X + 2}px`;
        item.branch.style.top = `${y + 40}px`;
        item.branch.style.width = `${bk * 118}px`;
        item.branch.style.opacity = 1 - outK;
      }
    });
    const tk = easeOut(prog(t, a + 0.8, a + 1.3));
    trunk.style.left = `${TREE_X}px`; trunk.style.top = `${TREE_TOP + 20}px`;
    trunk.style.height = `${tk * (TREE_BOTTOM - TREE_TOP + 40)}px`;
    trunk.style.opacity = 1 - outK;
  }

  // ---- headings
  headingEls.forEach((el, i) => set(el, headingState(i, t)));

  // ---- manuscript + character cards
  {
    const ms = $("#ms"), ch = $("#char"), pill = $("#pill");
    const linkIn = easeOut(prog(t, 6.35, 6.85));
    let msX = 140, msY = 790, msO = 0, msW = 800;
    msO = linkIn;
    msY = lerp(830, 790, linkIn);
    // side-by-side: move up
    const sideK = easeInOut(prog(t, 8.5, 9.0));
    msY = lerp(msY, 740, sideK);
    // theme: settle
    const themeK = easeInOut(prog(t, 10.5, 10.95));
    msY = lerp(msY, 800, themeK);
    // goal: hide
    const goalOut = easeInOut(prog(t, 13.3, 13.6));
    const rewindIn = easeOut(prog(t, 15.55, 15.95));
    // export: shrink into files
    const expK = easeInOut(prog(t, 17.75, 18.25));
    let o = msO * (1 - goalOut) + rewindIn * (t >= 15.5 ? 1 : 0);
    if (t >= 15.5) msY = lerp(830, 800, rewindIn);
    const s = lerp(1, 0.3, expK);
    o *= 1 - prog(t, 17.95, 18.25);
    ms.style.width = `${msW}px`;
    set(ms, { x: msX, y: msY, s, o });
    // rewind edits
    let n = msChars.length;
    if (t >= 15.5) {
      const del = prog(t, 16.0, 16.5), back = t >= 16.85;
      n = back ? msChars.length : Math.round(lerp(msChars.length, msChars.length * 0.42, del));
    }
    ms.querySelector(".text").innerHTML = msHTML(n);
    const restoreFlash = Math.sin(Math.PI * prog(t, 16.8, 17.3));
    ms.style.background = restoreFlash > 0 ? mix("#fffefb", "#e8efe7", restoreFlash) : "";

    // pill
    const pillK = easeOut(prog(t, 7.5, 7.85));
    const pillOut = prog(t, 8.45, 8.7);
    set(pill, { x: 146, y: 1072, o: pillK * (1 - pillOut) });

    // character card
    const chIn = easeOut(prog(t, 7.0, 7.45));
    let cx = 200, cy = lerp(1210, 1170, chIn), co = chIn;
    cx = lerp(cx, 140, sideK); cy = lerp(cy, 1060, sideK);
    const chOut = prog(t, 10.5, 10.8);
    ch.style.width = `${lerp(620, 800, sideK)}px`;
    set(ch, { x: cx, y: cy, o: co * (1 - chOut) });

    // link line from highlight to card
    const mark = ms.querySelector("mark");
    const draw = easeInOut(prog(t, 6.75, 7.2));
    const linkOut = prog(t, 8.45, 8.7);
    if (mark && t > 6.6 && t < 8.7) {
      const r = mark.getBoundingClientRect();
      const x1 = r.left + r.width / 2, y1 = r.bottom - 6;
      const x2 = cx + 470, y2 = cy + 4;
      const d = `M${x1},${y1} C${x1},${y1 + 120} ${x2},${y2 - 140} ${x2},${y2}`;
      const path = $("#link-path"); path.setAttribute("d", d);
      const len = path.getTotalLength(); path.style.strokeDasharray = len; path.style.strokeDashoffset = len * (1 - draw);
      const pt = path.getPointAtLength(len * draw);
      $("#link-dot").setAttribute("cx", pt.x); $("#link-dot").setAttribute("cy", pt.y);
      $("#link").style.opacity = 1 - linkOut;
    } else $("#link").style.opacity = 0;
    // highlight pop
    if (mark) mark.style.background = t < 6.6 && t > 6.3 ? "transparent" : "";

    // divider
    const dk = easeInOut(prog(t, 8.75, 9.3));
    const dOut = prog(t, 10.3, 10.55);
    $("#divider").style.width = `${dk * 1080}px`;
    set($("#divider"), { y: 1020, o: 1 - dOut });
  }

  // ---- swatches
  {
    const inK = easeOut(prog(t, 10.75, 11.1));
    const out = prog(t, 13.15, 13.4);
    set($("#swatches"), { y: lerp(30, 0, inK), o: inK * (1 - out) });
    document.querySelectorAll(".sw").forEach((el, i) => { el.classList.toggle("on", i === swIndex); el.querySelector("i").style.setProperty("--on", i === swIndex ? 1 : 0); });
  }

  // ---- goals
  {
    const inK = easeOut(prog(t, 13.5, 13.9));
    const out = prog(t, 15.2, 15.5);
    set($("#goals"), { x: 0, y: lerp(830, 790, inK), o: inK * (1 - out) });
    const goals = document.querySelectorAll(".goal");
    C.goals.forEach(([_, value, total, unit], i) => {
      const k = easeOut(prog(t, 13.75 + i * 0.25, 14.85 + i * 0.25));
      goals[i].querySelector("b").innerHTML = `<em>${fmt(value * k)}</em> / ${fmt(total)}${esc(unit)}`;
      goals[i].querySelector(".fill").style.width = `${(value / total) * k * 100}%`;
    });
  }

  // ---- rewind timeline
  {
    const inK = easeOut(prog(t, 15.75, 16.1));
    const out = prog(t, 17.45, 17.7);
    set($("#timeline"), { y: lerp(20, 0, inK), o: inK * (1 - out) });
    const move = easeInOut(prog(t, 16.4, 16.85));
    $("#knob").style.left = `${lerp(680, 340, move)}px`;
  }

  // ---- export files
  {
    fileEls.forEach((f, i) => {
      const k = easeBack(prog(t, 18.05 + i * 0.12, 18.6 + i * 0.12));
      const out = prog(t, 19.7, 20.0);
      const tx = 540 - 105 + (i - 1.5) * 200;
      const r = (i - 1.5) * 4;
      set(f, { x: lerp(540 - 105, tx, k), y: lerp(940, 860, k) + Math.abs(i - 1.5) * 18 - out * 40, r: r * k, s: lerp(0.5, 1, k), o: clamp(k * 2) * (1 - out) });
      f.style.zIndex = 10 + i;
    });
    const nk = easeOut(prog(t, 18.7, 19.1));
    set($("#paper-note"), { y: lerp(20, 0, nk), o: nk * (1 - prog(t, 19.7, 20.0)) });
  }

  // ---- ending
  {
    const ring = easeInOut(prog(t, 20.05, 20.85));
    ringRect.style.strokeDashoffset = ringLen * (1 - ring);
    set($("#ring"), { o: t > 20.0 ? 1 : 0, s: 1 });
    const logoK = easeOut(prog(t, 20.6, 21.15));
    set($("#logo"), { s: lerp(1.04, 1.1, logoK), o: logoK });
    const w = easeOut(prog(t, 21.05, 21.5));
    set($("#wordmark"), { y: lerp(26, 0, w), o: w });
    const tg = easeOut(prog(t, 21.45, 21.9));
    set($("#tagline"), { y: lerp(20, 0, tg), o: tg });
    const m = easeOut(prog(t, 21.95, 22.4));
    set($("#meta"), { y: lerp(16, 0, m), o: m });
    set($("#cta"), { y: lerp(16, 0, m), o: m });
  }
}

window.DURATION = DURATION;
window.render = render;
// touch every scene once so each font subset and weight gets requested before frames are captured
for (let k = 0; k <= DURATION; k += 0.25) render(k);
window.ready = Promise.all([new Promise((r) => setTimeout(r, 50)).then(() => document.fonts.ready), new Promise((r) => { const img = $("#logo img"); img.complete ? r() : img.onload = r; })]);
const seek = new URLSearchParams(location.search).get("t");
if (seek !== null) render(parseFloat(seek));
else { const start = performance.now(); const loop = () => { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
